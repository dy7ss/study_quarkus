worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format lab '$remote_addr "$request" $status '
                   'upstream_status=$upstream_status '
                   'request_time=$request_time '
                   'upstream_response_time=$upstream_response_time';
    access_log /dev/stdout lab;
    error_log /dev/stderr notice;

    upstream quarkus {
        server host.docker.internal:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # 通常のリバースプロキシ。デフォルトのバッファリングを使う。
        location = /csv/timesleep-buffered {
            proxy_pass http://quarkus/csv/timesleep;
            proxy_http_version 1.1;
            proxy_read_timeout 15s;
        }

        # 上流から届いたデータをバッファせず、クライアントへ転送する。
        location = /csv/timesleep-streaming {
            proxy_pass http://quarkus/csv/timesleep;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 15s;
        }

        # 1秒ごとの上流出力に対して、500ms入力がなければタイムアウトする。
        location = /csv/timesleep-timeout {
            proxy_pass http://quarkus/csv/timesleep;
            proxy_http_version 1.1;
            proxy_read_timeout 500ms;
        }
    }
}
