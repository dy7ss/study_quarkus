version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: csvdownload-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: csvdownload
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
