quarkus.http.port=8080

# MySQL connection settings (docker-friendly, can be overridden by environment variables)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USER:app}
quarkus.datasource.password=${MYSQL_PASSWORD:app}
quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:csvdownload}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci

# Keep schema management explicit, so the empty customer table is created via SQL script instead of automatic DDL.
quarkus.hibernate-orm.database.generation=none
